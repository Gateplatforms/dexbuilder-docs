{
  "openapi": "3.0.3",
  "info": {
    "title": "DexBuilder Broker API",
    "version": "1.0.0",
    "description": "DexBuilder 项目方底层 REST 接口。Broker 使用 Broker API Key 调用用户级接口时，必须提供 sub_user_wallet_addr。"
  },
  "servers": [
    {
      "url": "https://api.dexbuilder.com"
    }
  ],
  "paths": {
    "/api/v4/dexbuilder/deposit/fee": {
      "post": {
        "tags": [
          "充值"
        ],
        "summary": "估算充值手续费",
        "operationId": "estimateDexBuilderDepositFee",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DepositRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "查询成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeDepositFee"
                }
              }
            }
          },
          "401": {
            "description": "Broker API Key 或签名无效"
          },
          "403": {
            "description": "Broker 权限不足，或目标钱包未通过归属校验"
          }
        },
        "security": [
          {
            "BrokerAPIKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/SubUserWalletAddr"
          }
        ]
      }
    },
    "/api/v4/dexbuilder/deposit/history": {
      "get": {
        "tags": [
          "充值"
        ],
        "summary": "查询充值历史",
