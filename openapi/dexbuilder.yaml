  "components": {
    "securitySchemes": {
      "BrokerAPIKey": {
        "type": "apiKey",
        "in": "header",
        "name": "KEY",
        "description": "Broker API Key"
      },
      "Timestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "Timestamp",
        "description": "Unix 秒级时间戳"
      },
      "Signature": {
        "type": "apiKey",
        "in": "header",
        "name": "SIGN",
        "description": "使用 Broker Secret Key 生成的 HMAC-SHA512 十六进制签名"
      }
    },
    "parameters": {
      "AssetQuery": {
        "name": "asset",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "USDT",
        "description": "资产符号过滤，如 USDT"
      },
      "NetworkQuery": {
        "name": "network",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "ethereum",
        "description": "网络标识，如 ethereum"
      },
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        },
        "description": "页码，从 1 开始"
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        },
        "description": "每页条数，最大 100"
      },
      "SubUserWalletAddr": {
        "name": "sub_user_wallet_addr",
        "in": "header",
        "required": true,
        "description": "目标终端用户钱包地址。网关校验该钱包对应的用户属于当前 Broker。",
        "schema": {
          "type": "string"
        }
      },
      "DeviceType": {
        "name": "x-perp-device-type",
        "in": "header",
        "required": true,
        "description": "设备类型：1 Android、2 iOS、3 WEB、4 H5。仅在标明必填的接口中要求传递。",
        "schema": {
          "type": "string",
          "enum": [
            "1",
            "2",
            "3",
            "4"
          ]
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "幂等键，最长 128 字符，建议使用 UUID。同一用户在同一提交接口使用相同 Key 重试时，服务端返回首次成功请求的响应；网络超时后可使用原 Key 重试。不同请求不得复用 Key。",
        "schema": {
          "type": "string",
          "maxLength": 128
        },
        "example": "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      }
    },
    "responses": {
      "OpenAPIBadRequest": {
        "description": "请求无效（参数、请求体、用户身份或业务校验）",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "examples": {
              "invalidArgument": {
                "summary": "参数无效",
                "value": {
                  "label": "INVALID_ARGUMENT",
                  "message": "invalid argument"
                }
              },
              "userNotFound": {
                "summary": "用户不存在",
                "value": {
                  "label": "USER_NOT_FOUND",
                  "message": "User not found"
                }
              },
              "missingHeader": {
                "summary": "缺少必要请求头",
                "value": {
                  "label": "MISSING_REQUIRED_HEADER",
                  "message": "invalid headers"
                }
              }
            }
          }
        }
      },
      "ProjectAccessDenied": {
        "description": "项目未绑定或 Broker/API Key 不匹配",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 40300801,
              "reason": "P_DEX_BUILDER_IN_PROJECT_ACCESS_DENIED",
              "label": "PROJECT_ACCESS_DENIED",
              "message": "project access denied",
              "data": null
            }
          }
        }
      },
      "UserNotFound": {
        "description": "用户不存在或未绑定钱包",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 405007,
              "reason": "P_DEX_BUILDER_IN_USER_NOT_FOUND",
              "label": "USER_NOT_FOUND",
              "message": "User not found",
              "data": null
            }
          }
        }
      },
      "GatewayUnauthorized": {
        "description": "Broker API Key、签名或时间戳无效",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "examples": {
              "invalidKey": {
                "summary": "无效 API Key",
                "value": {
                  "label": "INVALID_KEY",
                  "message": "Invalid key provided",
                  "code": 401,
                  "trace_id": "abc123"
                }
              },
              "invalidSignature": {
                "summary": "签名错误",
                "value": {
                  "label": "INVALID_SIGNATURE",
                  "message": "Invalid signature",
                  "code": 401,
                  "trace_id": "abc123"
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "ErrorEnvelope": {
        "allOf": [
          {
            "$ref": "#/components/schemas/EnvelopeBase"
          },
          {
            "type": "object",
            "required": [
              "label"
            ],
            "properties": {
              "label": {
                "type": "string",
                "description": "稳定的机器可读错误标识"
              },
              "data": {
                "nullable": true,
