{
  "openapi": "3.0.3",
  "info": {
    "title": "DexBuilder 平台 Broker API",
    "version": "1.0.0",
    "description": "DexBuilder 平台的 19 个 Broker 业务接口。认证和用户钱包校验见本站统一网关说明。"
