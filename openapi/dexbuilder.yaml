    "parameters": {
      "AssetQuery": {
        "name": "asset",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "USDT"
      },
      "NetworkQuery": {
        "name": "network",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "ethereum"
      },
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        }
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        }
      },
      "SubUserWalletAddr": {
        "name": "sub_user_wallet_addr",
        "in": "header",
        "required": true,
        "description": "目标终端用户钱包地址。网关校验该钱包对应的用户属于当前 Broker。",
        "schema": {
          "type": "string"
        }
      },
      "DeviceType": {
        "name": "x-gate-device-type",
        "in": "header",
        "required": true,
        "description": "设备类型，须为 Perp 支持的枚举值（如 web）",
        "schema": {
          "type": "string"
        },
        "example": "web"
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "schema": {
          "type": "string"
        }
      }
    },
    "responses": {
      "ProjectAccessDenied": {
        "description": "项目未绑定或 Broker/API Key 不匹配",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 40300801,
              "reason": "PROJECT_ACCESS_DENIED",
              "message": "project access denied"
            }
          }
        }
      },
      "UserNotFound": {
        "description": "用户不存在或未绑定钱包",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 405007,
              "reason": "USER_NOT_FOUND",
              "message": "User not found"
            }
          }
        }
      }
    },
    "securitySchemes": {
      "BrokerAPIKey": {
        "type": "apiKey",
        "in": "header",
        "name": "KEY",
        "description": "Broker API Key"
      },
      "Timestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "Timestamp",
        "description": "Unix 秒级时间戳"
      },
      "Signature": {
        "type": "apiKey",
        "in": "header",
        "name": "SIGN",
        "description": "使用 Broker Secret Key 生成的 HMAC-SHA512 十六进制签名"
      }
    }
  }
