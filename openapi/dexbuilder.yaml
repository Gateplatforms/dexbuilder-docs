      "get": {
        "tags": [
          "资产配置"
        ],
        "summary": "查询支持资产",
        "description": "返回当前 Broker 可用的充值与提现资产列表。",
        "operationId": "listDexBuilderAssets",
        "responses": {
          "200": {
            "description": "查询成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeArrayOfAsset"
                }
              }
            }
          },
          "401": {
            "description": "Broker API Key 或签名无效",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "403": {
            "description": "Broker 权限不足，或目标钱包未通过归属校验",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        },
        "security": [
          {
            "BrokerAPIKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ]
      }
    },
