    "/api/v4/dexbuilder/deposit/sign_data": {
      "post": {
        "tags": [
          "充值"
        ],
        "summary": "获取充值签名数据",
        "description": "返回链上充值所需的 calldata 与 Vault 合约地址。若用户在该链尚未绑定 Perp 账户，首次成功调用会完成绑定；重复调用不会重复绑定。",
        "operationId": "dexBuilderDepositSignData",
        "parameters": [
          {
            "$ref": "#/components/parameters/SubUserWalletAddr"
          },
          {
            "name": "x-perp-device-type",
            "in": "header",
            "required": false,
            "description": "设备类型（1/2/3/4），风控使用，建议填写",
            "schema": {
              "type": "string",
              "enum": [
                "1",
                "2",
                "3",
                "4"
              ]
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PerpDepositSignDataRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeDepositSignData"
                }
              }
            }
          },
          "401": {
