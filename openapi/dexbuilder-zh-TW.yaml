    "/api/v4/dexbuilder/deposit/sign_data": {
      "post": {
        "tags": [
          "充值"
        ],
        "summary": "獲取充值簽名資料",
        "description": "回傳鏈上充值所需的 calldata 與 Vault 合約地址。若使用者在該鏈尚未綁定 Perp 賬戶，首次成功呼叫會完成綁定；重復呼叫不會重復綁定。",
        "operationId": "dexBuilderDepositSignData",
        "parameters": [
          {
            "$ref": "#/components/parameters/SubUserWalletAddr"
          },
          {
            "name": "x-perp-device-type",
            "in": "header",
            "required": false,
            "description": "設備類型（1/2/3/4），風控使用，建議填寫",
            "schema": {
              "type": "string",
              "enum": [
                "1",
                "2",
                "3",
                "4"
              ]
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PerpDepositSignDataRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeDepositSignData"
                }
