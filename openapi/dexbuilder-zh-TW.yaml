      "get": {
        "tags": [
          "資產配置"
        ],
        "summary": "查詢支持資產",
        "description": "回傳當前 Broker 可用的充值與提現資產列表。",
        "operationId": "listDexBuilderAssets",
        "responses": {
          "200": {
            "description": "查詢成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeArrayOfAsset"
                }
              }
            }
          },
          "401": {
            "description": "Broker API Key 或簽名無效",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "403": {
            "description": "Broker 權限不足，或目標錢包未通過歸屬校驗",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        },
        "security": [
          {
            "BrokerAPIKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ]
