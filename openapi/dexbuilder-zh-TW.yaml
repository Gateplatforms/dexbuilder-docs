  "components": {
    "securitySchemes": {
      "BrokerAPIKey": {
        "type": "apiKey",
        "in": "header",
        "name": "KEY",
        "description": "Broker API Key"
      },
      "Timestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "Timestamp",
        "description": "Unix 秒級時間戳"
      },
      "Signature": {
        "type": "apiKey",
        "in": "header",
        "name": "SIGN",
        "description": "使用 Broker Secret Key 生成的 HMAC-SHA512 十六進制簽名"
      }
    },
    "parameters": {
      "AssetQuery": {
        "name": "asset",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "USDT",
        "description": "資產符號過濾，如 USDT"
      },
      "NetworkQuery": {
        "name": "network",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "ethereum",
        "description": "網路標識，如 ethereum"
      },
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        },
        "description": "頁碼，從 1 開始"
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        },
        "description": "每頁條數，最大 100"
      },
      "SubUserWalletAddr": {
        "name": "sub_user_wallet_addr",
        "in": "header",
        "required": true,
        "description": "目標終端使用者錢包地址。網關校驗該錢包對應的使用者屬於當前 Broker。",
        "schema": {
          "type": "string"
        }
      },
      "DeviceType": {
        "name": "x-perp-device-type",
        "in": "header",
        "required": true,
        "description": "設備類型：1 Android、2 iOS、3 WEB、4 H5。僅在標明必填的介面中要求傳遞。",
        "schema": {
          "type": "string",
          "enum": [
            "1",
            "2",
            "3",
            "4"
          ]
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "冪等鍵，最長 128 字符，建議使用 UUID。同一使用者在同一提交介面使用相同 Key 重試時，服務端回傳首次成功請求的回應；網路超時後可使用原 Key 重試。不同請求不得復用 Key。",
        "schema": {
          "type": "string",
          "maxLength": 128
        },
        "example": "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      }
    },
    "responses": {
      "OpenAPIBadRequest": {
        "description": "請求無效（參數、請求體、使用者身份或業務校驗）",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "examples": {
              "invalidArgument": {
                "summary": "參數無效",
                "value": {
                  "label": "INVALID_ARGUMENT",
                  "message": "invalid argument"
                }
              },
              "userNotFound": {
                "summary": "使用者不存在",
                "value": {
                  "label": "USER_NOT_FOUND",
                  "message": "User not found"
                }
              },
              "missingHeader": {
                "summary": "缺少必要請求頭",
                "value": {
                  "label": "MISSING_REQUIRED_HEADER",
                  "message": "invalid headers"
                }
              }
            }
          }
        }
      },
      "ProjectAccessDenied": {
        "description": "專案未綁定或 Broker/API Key 不匹配",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 40300801,
              "reason": "P_DEX_BUILDER_IN_PROJECT_ACCESS_DENIED",
              "label": "PROJECT_ACCESS_DENIED",
              "message": "project access denied",
              "data": null
            }
          }
        }
      },
      "UserNotFound": {
        "description": "使用者不存在或未綁定錢包",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 405007,
              "reason": "P_DEX_BUILDER_IN_USER_NOT_FOUND",
              "label": "USER_NOT_FOUND",
              "message": "User not found",
              "data": null
            }
          }
        }
      },
      "GatewayUnauthorized": {
        "description": "Broker API Key、簽名或時間戳無效",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "examples": {
              "invalidKey": {
                "summary": "無效 API Key",
                "value": {
                  "label": "INVALID_KEY",
                  "message": "Invalid key provided",
                  "code": 401,
                  "trace_id": "abc123"
                }
              },
              "invalidSignature": {
                "summary": "簽名錯誤",
                "value": {
                  "label": "INVALID_SIGNATURE",
                  "message": "Invalid signature",
                  "code": 401,
                  "trace_id": "abc123"
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "ErrorEnvelope": {
        "allOf": [
          {
            "$ref": "#/components/schemas/EnvelopeBase"
          },
          {
            "type": "object",
            "required": [
              "label"
            ],
            "properties": {
              "label": {
                "type": "string",
                "description": "穩定的機器可讀錯誤標識"
              },
              "data": {
                "nullable": true,
                "description": "錯誤時一般為 null"
              }
            }
          }
        ]
      },
      "EnvelopeBase": {
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "example": 0,
            "description": "業務碼，`0` 表示成功"
