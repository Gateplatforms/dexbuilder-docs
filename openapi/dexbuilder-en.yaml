      "Asset": {
        "type": "object",
        "properties": {
          "asset": {
            "type": "string",
            "example": "USDT",
            "description": "Asset symbol, such as USDT"
          },
          "name": {
            "type": "string",
            "example": "Tether USD",
            "description": "Display name of the asset"
          }
        }
      },
      "Network": {
        "type": "object",
        "properties": {
          "asset": {
            "type": "string",
            "description": "Asset symbol"
          },
          "network": {
            "type": "string",
            "description": "Network identifier matching the chain parameter, such as ethereum, bsc, or solana"
          },
          "chain_id": {
            "type": "string",
            "description": "Chain ID as a decimal string"
          },
          "vm": {
            "type": "string",
            "enum": [
              "evm",
              "solana"
            ],
            "description": "Virtual machine: evm or solana"
          },
          "token_address": {
            "type": "string",
            "description": "Token contract address: 0x-prefixed hex for EVM, mint base58 for Solana"
          },
          "vault_address": {
            "type": "string",
            "description": "Perp Vault contract address"
          },
          "decimals": {
            "type": "integer",
            "description": "Token decimals as an integer"
          },
          "deposit_enabled": {
            "type": "boolean",
            "description": "Whether deposits are enabled on this network"
          },
          "withdraw_enabled": {
            "type": "boolean",
            "description": "Whether withdrawals are enabled on this network"
          },
          "min_deposit": {
            "type": "string",
            "description": "Minimum deposit amount as a decimal string in display token units"
          },
          "min_withdraw": {
            "type": "string",
            "description": "Minimum withdrawal amount as a decimal string in display token units"
          }
        }
      },
      "DwStatus": {
        "type": "object",
        "properties": {
          "asset": {
            "type": "string",
            "description": "Asset symbol"
          },
          "network": {
            "type": "string",
            "description": "Network identifier"
          },
          "deposit_enabled": {
            "type": "boolean",
            "description": "Deposit availability"
          },
          "withdraw_enabled": {
            "type": "boolean",
            "description": "Withdrawal availability"
          }
        }
      },
      "UserInfo": {
        "type": "object",
        "properties": {
