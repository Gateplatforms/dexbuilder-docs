    "/api/v4/dexbuilder/deposit/sign_data": {
      "post": {
        "tags": [
          "Deposit"
        ],
        "summary": "Get deposit signing data",
        "description": "Return the calldata and Vault contract address needed for an onchain deposit. A first successful call may persistently bind the user's Perp account to the wallet; repeated calls do not create another binding.",
        "operationId": "dexBuilderDepositSignData",
        "parameters": [
          {
            "$ref": "#/components/parameters/SubUserWalletAddr"
          },
          {
            "name": "x-perp-device-type",
            "in": "header",
            "required": false,
            "description": "Device type (1/2/3/4). Recommended for risk controls.",
            "schema": {
              "type": "string",
              "enum": [
                "1",
                "2",
                "3",
                "4"
              ]
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PerpDepositSignDataRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeDepositSignData"
                }
              }
            }
          },
          "401": {
            "description": "Invalid Broker API Key or signature",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
