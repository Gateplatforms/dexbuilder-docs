      "HistoryPage": {
        "type": "object",
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": true
            }
          },
          "page": {
            "type": "integer"
          },
          "page_size": {
            "type": "integer"
          },
          "total": {
            "type": "integer",
            "format": "int64"
          }
        }
      },
      "DepositRequest": {
        "type": "object",
        "required": [
          "address",
          "chain",
          "token_address",
          "token_amount",
          "token_symbol"
        ],
        "properties": {
          "address": {
            "type": "string",
            "description": "Bound wallet initiating the deposit; EVM 0x hex or Solana base58"
          },
          "chain": {
            "type": "string",
            "description": "Chain identifier; must match the token's network"
          },
          "token_address": {
            "type": "string",
            "description": "Token contract; use the chain's designated zero address for a native token"
          },
          "token_amount": {
            "type": "string",
            "description": "Deposit amount as a decimal string"
          },
          "token_symbol": {
            "type": "string",
            "description": "Token symbol, such as USDT"
          }
        }
      },
      "PerpDepositSignDataRequest": {
        "type": "object",
        "required": [
          "address",
          "chain",
          "token_address",
          "token_amount",
          "token_symbol"
        ],
        "properties": {
          "address": {
            "type": "string",
            "description": "Bound user wallet; must match sub_user_wallet_addr"
          },
          "chain": {
            "type": "string",
            "description": "Chain identifier"
          },
          "token_address": {
            "type": "string",
            "description": "Token contract address"
          },
          "token_amount": {
            "type": "string",
            "description": "Deposit amount as a decimal string"
          },
          "token_symbol": {
            "type": "string",
            "description": "Token symbol"
          },
          "native_fee": {
            "type": "integer",
            "format": "int64",
            "description": "native_fee from POST /deposit/fee, in the chain's smallest native unit as int64"
          },
          "lz_fee": {
            "type": "integer",
            "format": "int64",
            "description": "From POST /deposit/fee: convert the USDT decimal lz_fee to int64 with six decimal places (for example, 0.5 to 500000); pass native_fee unchanged as int64"
          }
