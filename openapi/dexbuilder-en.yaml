    "/api/v4/dexbuilder/assets": {
      "get": {
        "tags": [
          "Asset configuration"
        ],
        "summary": "List supported assets",
        "description": "Return the deposit and withdrawal assets available to the current Broker.",
        "operationId": "listDexBuilderAssets",
        "responses": {
          "200": {
            "description": "Query successful",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/EnvelopeArrayOfAsset"
                }
              }
            }
          },
          "401": {
            "description": "Invalid Broker API Key or signature",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "403": {
            "description": "Insufficient Broker permissions, or the target wallet failed the ownership check",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        },
        "security": [
          {
            "BrokerAPIKey": [],
            "Timestamp": [],
            "Signature": []
          }
        ]
      }
    },
