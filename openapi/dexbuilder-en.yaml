            "type": "string",
            "description": "End-user ID mapped by the project"
          },
          "project_id": {
            "type": "string",
            "description": "DexBuilder project ID"
          },
          "status": {
            "type": "string",
            "example": "active",
            "description": "User status, such as active"
          },
          "wallets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/UserInfoWallet"
            },
            "description": "List of bound wallets"
          }
        }
      },
      "WalletItem": {
        "type": "object",
        "properties": {
          "wallet_id": {
            "type": "string",
            "description": "Wallet record ID"
          },
          "chain": {
            "type": "string",
            "description": "Chain identifier"
          },
          "address": {
            "type": "string",
            "description": "Wallet address; it must match sub_user_wallet_addr to act on behalf of this user"
          },
          "status": {
            "type": "string",
            "description": "Binding status"
          },
          "is_primary": {
            "type": "boolean",
            "description": "Whether this is the primary wallet"
          },
          "bound_at": {
            "type": "integer",
            "format": "int64",
            "description": "Binding time as a Unix millisecond timestamp"
          }
        }
