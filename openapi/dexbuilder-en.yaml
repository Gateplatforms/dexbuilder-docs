  "components": {
    "securitySchemes": {
      "BrokerAPIKey": {
        "type": "apiKey",
        "in": "header",
        "name": "KEY",
        "description": "Broker API Key"
      },
      "Timestamp": {
        "type": "apiKey",
        "in": "header",
        "name": "Timestamp",
        "description": "Unix timestamp in seconds"
      },
      "Signature": {
        "type": "apiKey",
        "in": "header",
        "name": "SIGN",
        "description": "Hexadecimal HMAC-SHA512 signature generated with the Broker Secret Key"
      }
    },
    "parameters": {
      "AssetQuery": {
        "name": "asset",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "USDT",
        "description": "Filter by asset symbol, such as USDT"
      },
      "NetworkQuery": {
        "name": "network",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string"
        },
        "example": "ethereum",
        "description": "Network identifier, such as ethereum"
      },
      "Page": {
        "name": "page",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "default": 1
        },
        "description": "Page number, starting at 1"
      },
      "PageSize": {
        "name": "page_size",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 100,
          "default": 20
        },
        "description": "Number of records per page, maximum 100"
      },
      "SubUserWalletAddr": {
        "name": "sub_user_wallet_addr",
        "in": "header",
        "required": true,
        "description": "Target user's wallet address. The gateway verifies that the user belongs to the current Broker.",
        "schema": {
          "type": "string"
        }
      },
      "DeviceType": {
        "name": "x-perp-device-type",
        "in": "header",
        "required": true,
        "description": "Device type: 1 Android, 2 iOS, 3 WEB, 4 H5. Required only on endpoints that mark it as required.",
        "schema": {
          "type": "string",
          "enum": [
            "1",
            "2",
            "3",
            "4"
          ]
        }
      },
      "IdempotencyKey": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Idempotency key, maximum 128 characters; UUID recommended. Retrying the same submit endpoint for the same user with the same key returns the first successful response. Reuse the key after a network timeout, but never reuse it for a different request.",
        "schema": {
          "type": "string",
          "maxLength": 128
        },
        "example": "7c9e6679-7425-40de-944b-e07fc1f90ae7"
      }
    },
    "responses": {
      "OpenAPIBadRequest": {
        "description": "Invalid request: parameters, body, user identity, or business validation",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "examples": {
              "invalidArgument": {
                "summary": "Invalid parameter",
                "value": {
                  "label": "INVALID_ARGUMENT",
                  "message": "invalid argument"
                }
              },
              "userNotFound": {
                "summary": "User not found",
                "value": {
                  "label": "USER_NOT_FOUND",
                  "message": "User not found"
                }
              },
              "missingHeader": {
                "summary": "Missing required header",
                "value": {
                  "label": "MISSING_REQUIRED_HEADER",
                  "message": "invalid headers"
                }
              }
            }
          }
        }
      },
      "ProjectAccessDenied": {
        "description": "Project not bound, or Broker and API Key do not match",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 40300801,
              "reason": "P_DEX_BUILDER_IN_PROJECT_ACCESS_DENIED",
              "label": "PROJECT_ACCESS_DENIED",
              "message": "project access denied",
              "data": null
            }
          }
        }
      },
      "UserNotFound": {
        "description": "User not found or no wallet bound",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "example": {
              "code": 405007,
              "reason": "P_DEX_BUILDER_IN_USER_NOT_FOUND",
              "label": "USER_NOT_FOUND",
              "message": "User not found",
              "data": null
            }
          }
        }
      },
      "GatewayUnauthorized": {
        "description": "Invalid Broker API Key, signature, or timestamp",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            },
            "examples": {
              "invalidKey": {
                "summary": "Invalid API Key",
                "value": {
                  "label": "INVALID_KEY",
                  "message": "Invalid key provided",
                  "code": 401,
                  "trace_id": "abc123"
                }
              },
              "invalidSignature": {
                "summary": "Invalid signature",
                "value": {
                  "label": "INVALID_SIGNATURE",
                  "message": "Invalid signature",
                  "code": 401,
                  "trace_id": "abc123"
                }
              }
            }
          }
        }
      }
    },
    "schemas": {
      "ErrorEnvelope": {
        "allOf": [
          {
            "$ref": "#/components/schemas/EnvelopeBase"
          },
          {
            "type": "object",
            "required": [
              "label"
            ],
            "properties": {
              "label": {
                "type": "string",
                "description": "Stable machine-readable error label"
              },
              "data": {
                "nullable": true,
                "description": "Usually null on error"
              }
            }
          }
        ]
      },
      "EnvelopeBase": {
        "type": "object",
        "properties": {
          "code": {
            "type": "integer",
            "example": 0,
            "description": "Business code; 0 indicates success"
          },
          "message": {
            "type": "string",
            "example": "success",
            "description": "Human-readable message; success responses use success"
          },
          "reason": {
            "type": "string",
            "description": "Error reason identifier; usually empty on success"
          },
          "trace_id": {
            "type": "string",
            "description": "Trace ID to provide when requesting support"
          }
