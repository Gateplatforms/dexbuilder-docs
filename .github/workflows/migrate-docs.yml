name: Migrate DexBuilder docs

on:
  push:
    paths:
      - ".github/workflows/migrate-docs.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          repository: The-Dexbuilder/docs
          ref: main
          path: source

      - name: Copy documentation
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' source/ target/

      - name: Commit migration
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: target
          commit_message: "Migrate DexBuilder docs from previous repository"
